name: Soak native matrix proof (no publication)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Native cancellation or all-pass scenario
        required: true
        type: choice
        options: [functional-failure, soak-failure, explicit-cancel, all-pass]
  push:
    tags:
      - 'soak-matrix-*'

permissions:
  contents: read
  actions: read

env:
  PROBE_MODE: ${{ inputs.mode || '' }}

jobs:
  validation:
    name: probe / ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - kind: soak
          - kind: functional-stub
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4.7.1
        if: matrix.kind == 'soak'
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
          architecture: x64
      - uses: Ortus-Solutions/setup-commandbox@v2.0.1
        if: matrix.kind == 'soak'
        with:
          version: '6.3.5'
      - name: Launch soak and prove live HTTP and JVM telemetry
        if: matrix.kind == 'soak'
        run: python3 tests/soak/matrix_probe.py launch --output tests/results/soak/matrix-probe
      - name: Observe live soak
        if: matrix.kind == 'soak'
        run: exec python3 tests/soak/matrix_probe.py observe --output tests/results/soak/matrix-probe
      - name: Keep functional stub live or fail after soak readiness
        if: matrix.kind == 'functional-stub'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/soak/matrix_probe.py functional --output tests/results/soak/functional-stub
      - name: Verify controller cleanup and partial evidence
        if: always() && matrix.kind == 'soak'
        run: python3 tests/soak/matrix_probe.py verify-cleanup --output tests/results/soak/matrix-probe
      - name: Preserve cancellation evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: matrix-proof-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            tests/results/soak/
            !tests/results/soak/**/app/coldbox/**
            !tests/results/soak/**/app/modules/**
            !tests/results/soak/**/tmp/**
            !tests/results/soak/**/jvm/stream/**
          if-no-files-found: error
          retention-days: 30

  publication-stub:
    name: Publication stub (no provider calls)
    needs: validation
    runs-on: ubuntu-24.04
    concurrency:
      group: quick-soak-diagnostic-publication
      cancel-in-progress: false
    steps:
      - name: Record all-validation success without publishing
        run: |
          mkdir -p proof
          python3 -c 'import json,os; open("proof/publication-stub.json","w").write(json.dumps({"stubExecuted":True,"published":False,"candidateSha":os.environ["GITHUB_SHA"],"runId":os.environ["GITHUB_RUN_ID"]}))'
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: publication-stub-${{ github.run_id }}
          path: proof/
          if-no-files-found: error
